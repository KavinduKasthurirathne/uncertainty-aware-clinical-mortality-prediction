[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-mortality"
version = "0.1.0"
description = "Uncertainty-aware ICU mortality prediction"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
plots = ["matplotlib>=3.9"]

[project.scripts]
clinical-mortality = "clinical_mortality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
